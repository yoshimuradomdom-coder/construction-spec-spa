<html lang="ja">
<head>

<title>工事仕様書ビルダー</title>
<style>
:root{--blue:#075985;--blue2:#0369a1;--line:#cbd5e1;--bg:#f1f5f9;--text:#0f172a;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic","Meiryo",sans-serif;color:var(--text);background:var(--bg)}button,input,textarea,select{font:inherit}.header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:13px 24px;background:#fff;border-bottom:1px solid #e2e8f0}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--blue2);color:#fff;display:grid;place-items:center;font-size:22px}.brand b{display:block}.brand small{color:var(--muted)}.btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:700}.primary{background:var(--blue2);color:white}.secondary{background:white;border:1px solid var(--line);color:#334155}.danger{background:#fff1f2;color:#be123c}.row-actions{display:flex;flex-direction:column;gap:5px;align-self:end}.move-btn{min-width:38px;padding:6px 8px;background:#e0f2fe;color:#075985}.move-btn:disabled{opacity:.35;cursor:not-allowed}.row-actions .danger{padding:6px 8px}.layout{max-width:1280px;margin:auto;padding:24px;display:grid;grid-template-columns:220px 1fr;gap:20px}.nav,.card{background:white;border-radius:16px;box-shadow:0 2px 12px #0f172a12}.nav{padding:12px;height:max-content;position:sticky;top:92px}.nav button{display:block;width:100%;text-align:left;padding:13px;border:0;border-radius:10px;background:transparent;color:#475569;cursor:pointer}.nav button.active{background:var(--blue2);color:#fff;font-weight:700}.card{padding:22px;margin-bottom:18px}.card h2{margin:0 0 18px;font-size:19px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#475569}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:10px;padding:9px;background:white}.field textarea{min-height:90px;resize:vertical}.rowbox{display:grid;gap:10px;padding:14px;margin:12px 0;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc}.equip{grid-template-columns:1fr 1fr 1fr 80px 1.4fr auto}.contact{grid-template-columns:1.35fr 1fr 1fr 1fr 1fr 1.35fr auto;gap:8px;padding:10px}.contact .field{gap:3px}.contact .field label{font-size:10px}.contact .field input,.contact .field select{padding:7px 8px;font-size:12px;border-radius:8px}.contact .preset-tools{display:contents}.contact .preset-tools .field{grid-column:1/6;grid-row:2;min-width:0;border-top:1px dashed #cbd5e1;padding-top:7px}.contact .preset-tools .btn{padding:7px 10px;font-size:11px;white-space:nowrap}.contact .preset-tools .apply-preset{grid-column:6;grid-row:2;align-self:end}.contact .preset-tools .save-preset{grid-column:7;grid-row:1;align-self:end}.contact .row-actions{grid-column:6/8;grid-row:3;flex-direction:row;justify-content:flex-end;align-self:start;padding-top:1px}.contact .row-actions .move-btn,.contact .row-actions .danger{min-width:34px;padding:6px}.schedule{grid-template-columns:1fr 1.5fr 145px 125px 125px auto}.actions{display:flex;justify-content:space-between;margin-top:18px}.hide{display:none!important}.previewbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.paper-stack{background:#cbd5e1;padding:16px;border-radius:16px}.doc-page{position:relative;width:210mm;min-height:297mm;margin:0 auto 16px;background:#fff;padding:12mm 10mm;box-shadow:0 3px 15px #0f172a33;overflow:hidden}.doc-head{display:flex;justify-content:space-between;border-bottom:3px solid var(--blue);padding-bottom:9px}.doc-head h1{margin:2px 0;font-size:25px;letter-spacing:.12em}.en{font-size:9px;letter-spacing:.22em;color:var(--blue2);font-weight:700}.meta{text-align:right;font-size:10px;line-height:1.8}.section-title{display:flex;align-items:center;gap:10px;margin:20px 0 14px;border-bottom:2px solid var(--blue2);padding-bottom:7px;font-size:18px;font-weight:800}.num{width:27px;height:27px;border-radius:8px;background:var(--blue2);color:#fff;display:grid;place-items:center;font-size:12px}.info{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:11px}.info>div{display:grid;grid-template-columns:85px 1fr;border-bottom:1px solid #e2e8f0}.info .wide{grid-column:1/-1}.info b{padding:8px;background:#f1f5f9}.info span{padding:8px}.docbox{border:1px solid var(--line);border-radius:10px;padding:11px;white-space:pre-wrap;font-size:10px;line-height:1.8;min-height:70px}.sub{font-size:12px;margin:16px 0 7px}table{width:100%;border-collapse:collapse;font-size:9px}th{background:var(--blue);color:#fff;text-align:left}th,td{border:1px solid var(--line);padding:7px}.flow{padding:14px;border:1px solid #bae6fd;border-radius:10px;background:#f0f9ff;font-size:10px;font-weight:700}.footer{position:absolute;left:10mm;right:10mm;bottom:6mm;border-top:1px solid var(--line);padding-top:6px;display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}.gantt{border:1px solid var(--line);border-radius:10px;overflow:hidden}.g-row{display:grid;grid-template-columns:138px 1fr;min-height:48px;border-top:1px solid var(--line)}.g-row:first-child{border-top:0}.g-label{padding:7px;border-right:1px solid var(--line);font-size:8px}.g-label b{display:block}.g-track{position:relative;background:repeating-linear-gradient(to right,#e2e8f0 0 1px,transparent 1px 10%)}.g-bar{position:absolute;top:12px;height:23px;border-radius:5px;background:#0284c7;color:white;font-size:8px;padding:6px;white-space:nowrap}.g-head{background:#f1f5f9;min-height:34px}.g-times{position:relative;font-size:8px;overflow:visible}.g-times span{position:absolute;top:10px;transform:translateX(-50%);white-space:nowrap}.g-times .gap-label{top:7px;font-size:12px;font-weight:700;color:#64748b;background:#f1f5f9;padding:0 3px}.g-track .gap-mark{position:absolute;top:0;bottom:0;width:14px;transform:translateX(-50%);background:repeating-linear-gradient(135deg,transparent 0 3px,#94a3b8 3px 4px);opacity:.8;z-index:1}.g-bar{z-index:2;overflow:visible}.g-bar .work-break{position:absolute;top:0;bottom:0;width:16px;transform:translateX(-50%);background:repeating-linear-gradient(135deg,transparent 0 3px,rgba(255,255,255,.95) 3px 5px);border-left:1px solid rgba(255,255,255,.9);border-right:1px solid rgba(255,255,255,.9)}.note{margin-top:15px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px;font-size:9px}.top-actions{display:flex;gap:8px;align-items:center}.save-status{font-size:11px;color:var(--muted);white-space:nowrap}.hint{font-size:12px;color:var(--muted);margin:0 0 15px}
@media(max-width:900px){.contact{grid-template-columns:1fr 1fr}.contact .preset-tools{display:contents}.contact .preset-tools .field{grid-column:1/-1;grid-row:auto}.contact .preset-tools .apply-preset,.contact .preset-tools .save-preset{grid-column:auto;grid-row:auto}.contact .row-actions{grid-column:1/-1;grid-row:auto;justify-content:flex-end}.layout{grid-template-columns:1fr}.nav{position:static;display:flex;overflow:auto}.nav button{white-space:nowrap}.equip,.contact,.schedule{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.doc-page{transform-origin:top left;transform:scale(.72);margin-bottom:-82mm}.paper-stack{overflow:hidden}}
@page{size:A4 portrait;margin:0}@media print{body{background:#fff}.no-print{display:none!important}.layout{display:block;padding:0}.paper-stack{padding:0;background:#fff}.doc-page{width:210mm;height:297mm;min-height:297mm;margin:0;box-shadow:none;page-break-after:always;break-after:page;transform:none}.doc-page:last-child{page-break-after:auto;break-after:auto}.preview{display:block!important}}
</style>

<body>
<header class="header no-print"><div class="brand"><div class="logo">▣</div><div><b>工事仕様書ビルダー</b><small>ローカル動作・3ページPDF出力</small></div></div><div class="top-actions"><span class="save-status" id="saveStatus">未保存</span><button class="btn secondary" onclick="exportWorkFile()">ファイル保存</button><button class="btn secondary" onclick="input('workFileInput').click()">ファイル読込</button><input id="workFileInput" type="file" accept=".json,application/json" style="display:none" onchange="importWorkFile(event)"><button class="btn primary" onclick="goPreviewAndPrint()">印刷／PDF</button></div></header>
<div class="layout"><nav class="nav no-print" id="nav"><button class="active" onclick="showStep(0)">1. 工事内容書</button><button onclick="showStep(1)">2. 連絡体制</button><button onclick="showStep(2)">3. 工事スケジュール</button><button onclick="showStep(3)">4. プレビュー・PDF</button></nav><main>
<section class="step" id="step0"><div class="card"><h2>基本情報</h2><div class="grid2"><div class="field"><label>案件名</label><input id="project"></div><div class="field"><label>工事日</label><input id="date" type="date"></div><div class="field"><label>拠点名</label><input id="site"></div><div class="field"><label>現場責任者</label><input id="manager"></div><div class="field full"><label>住所</label><input id="address"></div><div class="field full"><label>工事概要</label><textarea id="overview"></textarea></div></div></div><div class="card"><h2>使用機器・���要部材</h2><div id="equipment"></div><button class="btn secondary" onclick="addEquipment()">＋ 機器を追加</button></div></section>
<section class="step hide" id="step1"><div class="card"><h2>関係者・関連会社</h2><div id="contacts"></div><button class="btn secondary" onclick="addContact()">＋ 会社を追加</button></div><div class="card"><h2>エスカレーションルール</h2><div class="field"><textarea id="escalation"></textarea></div></div></section>
<section class="step hide" id="step2"><div class="card"><h2>工事スケジュール</h2><p class="hint">開始・終了時刻から横棒グラフを自動描画します。</p><div id="schedules"></div><button class="btn secondary" onclick="addSchedule()">＋ 作業を追加</button></div><div class="card"><h2>タイムラインプレビュー</h2><div id="ganttEdit"></div></div></section>
<section class="step preview hide" id="step3"><div class="previewbar no-print"><b>A4・全3ページ プレビュー</b><button class="btn primary" onclick="window.print()">このプレビューを印刷</button></div><div class="paper-stack" id="document"></div></section>
<div class="actions no-print"><button class="btn secondary" onclick="move(-1)">← 戻る</button><button class="btn primary" onclick="move(1)">次へ →</button></div></main></div>
<script id="embeddedCompanyPresets" type="application/json">[]</script>
<script>
let current=0;const sample={project:'',site:'静岡銀行草薙センター',address:'〒424-0883　静岡県静岡市清水区草薙北1-10',date:'',manager:'渡辺喜浩',overview:'',escalation:'一般：現地作業者 → 現場責任者 → 工事統括\n作業遅延：現場責任者 → 工事統括 → 発注元担当\n重大障害：現場責任者 → 工事統括 → 発注元責任者 → 関係部署責任者',equipment:[{maker:'',model:'',serial:'',quantity:1,parts:''}],contacts:[{company:'株式会社NTTデータ東海',department:'第二事業部',person:'渡辺　喜浩',role:'現場責任者',phone:'054-345-4950',email:'sbk@am.nttdata-tokai.co.jp'},{company:'',department:'',person:'',role:'',phone:'',email:''}],schedules:[{company:'',work:'',date:'',start:'',end:''},{company:'',work:'',date:'',start:'',end:''}]};
let equipment=[],contacts=[],schedules=[];let companyPresets=[];const PRESET_KEY='construction-spec-company-presets-v1';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function input(id){return document.getElementById(id)}function field(label,val,cls,type='text'){return `<div class="field"><label>${label}</label><input class="${cls}" type="${type}" value="${esc(val)}"></div>`}function selectField(label,val,cls,options){const current=String(val??'');const list=[...new Set(options.filter(Boolean))];if(current&&!list.includes(current))list.push(current);return `<div class="field"><label>${label}</label><select class="${cls}"><option value="">選択してください</option>${list.map(x=>`<option value="${esc(x)}" ${x===current?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}function presetOptions(){return companyPresets.map((p,i)=>`<option value="${i}">${esc(p.company||'名称未設定')}${p.department?'（'+esc(p.department)+'）':''}</option>`).join('')}function loadPresets(){let embedded=[];try{embedded=JSON.parse(input('embeddedCompanyPresets').textContent||'[]')}catch(e){}let local=[];try{local=JSON.parse(localStorage.getItem(PRESET_KEY)||'[]')}catch(e){}const map=new Map();[...embedded,...local].forEach(p=>map.set([p.company,p.department].join('\u0001'),p));companyPresets=[...map.values()]}function savePresets(){try{localStorage.setItem(PRESET_KEY,JSON.stringify(companyPresets))}catch(e){}}
function localToday(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function loadSample(){['project','site','address','manager','overview','escalation'].forEach(k=>input(k).value=sample[k]);input('date').value=localToday();equipment=structuredClone(sample.equipment);contacts=structuredClone(sample.contacts);schedules=structuredClone(sample.schedules);renderEditors();renderDocument()}
function renderEditors(){input('equipment').innerHTML=equipment.map((r,i)=>`<div class="rowbox equip">${field('メーカー',r.maker,'maker')}${field('機種',r.model,'model')}${field('シリアル',r.serial,'serial')}${field('数量',r.quantity,'quantity','number')}${field('必要部材・備考',r.parts,'parts')}<div class="row-actions"><button type="button" class="btn move-btn" onclick="moveRow('equipment',${i},-1)" ${i===0?'disabled':''} title="上へ移動">↑</button><button type="button" class="btn move-btn" onclick="moveRow('equipment',${i},1)" ${i===equipment.length-1?'disabled':''} title="下へ移動">↓</button><button type="button" class="btn danger" onclick="removeRow('equipment',${i})">削除</button></div></div>`).join('');input('contacts').innerHTML=contacts.map((r,i)=>`<div class="rowbox contact">${field('会社名',r.company,'company')}${field('部署',r.department,'department')}${field('担当者',r.person,'person')}${field('役割',r.role,'role')}${field('電話番号',r.phone,'phone')}${field('メール',r.email,'email')}<div class="preset-tools"><div class="field"><label>会社情報プリセット</label><select class="preset-select"><option value="">登録済みプリセットを選択</option>${presetOptions()}</select></div><button type="button" class="btn secondary apply-preset" onclick="applyCompanyPreset(${i})">適用</button><button type="button" class="btn secondary save-preset" onclick="registerCompanyPreset(${i})">登録／更新</button></div><div class="row-actions"><button type="button" class="btn move-btn" onclick="moveRow('contacts',${i},-1)" ${i===0?'disabled':''} title="上へ移動">↑</button><button type="button" class="btn move-btn" onclick="moveRow('contacts',${i},1)" ${i===contacts.length-1?'disabled':''} title="下へ移動">↓</button><button type="button" class="btn danger" onclick="removeRow('contacts',${i})">削除</button></div></div>`).join('');const companyNames=contacts.map(x=>x.company.trim()).filter(Boolean);input('schedules').innerHTML=schedules.map((r,i)=>`<div class="rowbox schedule">${selectField('会社名',r.company,'company',companyNames)}${field('作業内容',r.work,'work')}${field('作業日',r.date||input('date').value,'workdate','date')}${field('開始',r.start,'start','time')}${field('終了',r.end,'end','time')}<div class="row-actions"><button type="button" class="btn move-btn" onclick="moveRow('schedules',${i},-1)" ${i===0?'disabled':''} title="上へ移動">↑</button><button type="button" class="btn move-btn" onclick="moveRow('schedules',${i},1)" ${i===schedules.length-1?'disabled':''} title="下へ移動">↓</button><button type="button" class="btn danger" onclick="removeRow('schedules',${i})">削除</button></div></div>`).join('');document.querySelectorAll('.rowbox input,.rowbox select.company').forEach(x=>x.addEventListener('input',syncRows));renderGantt('ganttEdit')}
function syncRows(){equipment=[...input('equipment').children].map(r=>({maker:r.querySelector('.maker').value,model:r.querySelector('.model').value,serial:r.querySelector('.serial').value,quantity:r.querySelector('.quantity').value,parts:r.querySelector('.parts').value}));contacts=[...input('contacts').children].map(r=>({company:r.querySelector('.company').value,department:r.querySelector('.department').value,person:r.querySelector('.person').value,role:r.querySelector('.role').value,phone:r.querySelector('.phone').value,email:r.querySelector('.email').value}));schedules=[...input('schedules').children].map(r=>({company:r.querySelector('.company').value,work:r.querySelector('.work').value,date:r.querySelector('.workdate').value,start:r.querySelector('.start').value,end:r.querySelector('.end').value}));renderGantt('ganttEdit')}
function selectedPresetIndex(i){const row=input('contacts').children[i];const sel=row&&row.querySelector('.preset-select');return sel&&sel.value!==''?Number(sel.value):-1}
function applyCompanyPreset(i){const pi=selectedPresetIndex(i);if(pi<0||!companyPresets[pi]){alert('呼び出すプリセットを選択してください。');return}syncRows();contacts[i]={...companyPresets[pi]};renderEditors();markUnsaved()}
function registerCompanyPreset(i){syncRows();const r=contacts[i];if(!r||!r.company.trim()){alert('会社名を入力してから登録してください。');return}const data={company:r.company.trim(),department:r.department,person:r.person,role:r.role,phone:r.phone,email:r.email};const found=companyPresets.findIndex(p=>p.company===data.company&&p.department===data.department);const action=found>=0?'更新':'登録';if(!confirm(`${data.company} の会社情報をプリセット${action}しますか？`))return;if(found>=0)companyPresets[found]=data;else companyPresets.push(data);savePresets();renderEditors();alert(`プリセットを${action}しました。`)}
function moveRow(k,i,direction){syncRows();const list=k==='equipment'?equipment:k==='contacts'?contacts:schedules;const target=i+direction;if(target<0||target>=list.length)return;[list[i],list[target]]=[list[target],list[i]];renderEditors();if(current===3)renderDocument()}
function removeRow(k,i){syncRows();if(k==='equipment')equipment.splice(i,1);else if(k==='contacts')contacts.splice(i,1);else if(k==='schedules')schedules.splice(i,1);renderEditors();if(current===3)renderDocument()}function addEquipment(){equipment.push({maker:'',model:'',serial:'',quantity:1,parts:''});renderEditors()}function addContact(){contacts.push({company:'',department:'',person:'',role:'',phone:'',email:''});renderEditors()}function addSchedule(){schedules.push({company:'',work:'',date:input('date').value,start:'09:00',end:'10:00'});renderEditors()}
function showStep(n){if(current===1)syncRows();current=Math.max(0,Math.min(3,n));document.querySelectorAll('.step').forEach((x,i)=>x.classList.toggle('hide',i!==current));document.querySelectorAll('#nav button').forEach((x,i)=>x.classList.toggle('active',i===current));if(current===3)renderDocument()}function move(d){showStep(current+d);scrollTo({top:0,behavior:'smooth'})}function goPreviewAndPrint(){showStep(3);setTimeout(()=>window.print(),100)}
function getData(){syncRows();return {project:input('project').value,site:input('site').value,address:input('address').value,date:input('date').value,manager:input('manager').value,overview:input('overview').value,escalation:input('escalation').value,equipment,contacts,schedules}}
function head(d){return `<div class="doc-head"><div><div class="en">CONSTRUCTION SPECIFICATION</div><h1>工事仕様書</h1></div><div class="meta"><b>${esc(d.project)||'案件名未入力'}</b><br>${esc(d.site)||'拠点名未入力'}<br>工事日：${esc(d.date)||'—'}</div></div>`}function foot(n){return `<div class="footer"><span>工事仕様書｜社外秘</span><span>${n} / 3</span></div>`}function title(n,t){return `<div class="section-title"><span class="num">${n}</span>${t}</div>`}
function ganttHtml(rows){
  const tm=t=>{let [h,m]=String(t||'00:00').split(':').map(Number);return h*60+m};
  const baseDateValue=input('date').value||localToday();
  const toDayNumber=value=>{const v=value||baseDateValue;const d=new Date(v+'T00:00:00');return Number.isNaN(d.getTime())?0:Math.round(d.getTime()/86400000)};
  const baseDay=toDayNumber(baseDateValue);
  const normalized=rows.map(r=>{
    const workDate=r.date||baseDateValue;
    const dayOffset=(toDayNumber(workDate)-baseDay)*1440;
    let start=tm(r.start)+dayOffset,end=tm(r.end)+dayOffset;
    const crossesMidnight=end<=start&&r.start&&r.end;
    if(crossesMidnight)end+=1440;
    return {r:{...r,date:workDate},start,end,crossesMidnight};
  });
  const valid=normalized.filter(x=>x.r.start&&x.r.end).sort((a,b)=>a.start-b.start);
  if(!valid.length)return `<div class="gantt"><div class="g-row g-head"><div class="g-label"><b>会社名／作業内容</b></div><div class="g-times"></div></div>${normalized.map(({r})=>`<div class="g-row"><div class="g-label"><b>${esc(r.company)||'未入力'}</b>${esc(r.work)||'作業内容'}</div><div class="g-track"></div></div>`).join('')}</div>`;
  let min=Math.floor(Math.min(...valid.map(x=>x.start))/60)*60;
  let max=Math.ceil(Math.max(...valid.map(x=>x.end))/60)*60;
  max=Math.max(max,min+60);
  const merged=[];valid.forEach(x=>{const last=merged[merged.length-1];if(!last||x.start>last.end)merged.push({start:x.start,end:x.end});else last.end=Math.max(last.end,x.end)});
  const gaps=[];for(let i=0;i<merged.length-1;i++){const a=merged[i].end,b=merged[i+1].start;if(b-a>=180)gaps.push({start:a,end:b,shown:30,type:'idle'})}
  const longWorkZones=[];
  valid.forEach(x=>{
    if(x.end-x.start>=120){
      const zoneStart=x.start+30,zoneEnd=x.end-30;
      const overlaps=valid.filter(other=>other!==x&&other.start<zoneEnd&&other.end>zoneStart)
        .map(other=>({start:Math.max(zoneStart,other.start),end:Math.min(zoneEnd,other.end)}))
        .sort((a,b)=>a.start-b.start);
      const mergedOverlaps=[];
      overlaps.forEach(o=>{const last=mergedOverlaps[mergedOverlaps.length-1];if(!last||o.start>last.end)mergedOverlaps.push({...o});else last.end=Math.max(last.end,o.end)});
      let cursor=zoneStart;
      [...mergedOverlaps,{start:zoneEnd,end:zoneEnd}].forEach(o=>{
        const freeEnd=Math.min(o.start,zoneEnd);
        if(freeEnd-cursor>=60)longWorkZones.push({start:cursor,end:freeEnd,shown:30,type:'work',owner:x});
        cursor=Math.max(cursor,o.end);
      });
    }
  });
  const compressionZones=[...gaps,...longWorkZones].sort((a,b)=>a.start-b.start);
  const removedBefore=t=>compressionZones.reduce((sum,g)=>sum+(t>=g.end?(g.end-g.start-g.shown):t>g.start?(t-g.start)*(1-g.shown/(g.end-g.start)):0),0);
  const mapTime=t=>t-removedBefore(t),mappedMin=mapTime(min),mappedMax=mapTime(max),span=Math.max(60,mappedMax-mappedMin),pct=t=>(mapTime(t)-mappedMin)/span*100;
  const rawStep=span<=720?60:span<=1440?120:span<=2880?180:360;
  const candidates=[];for(let x=Math.ceil(min/rawStep)*rawStep;x<=max;x+=rawStep){if(!compressionZones.some(g=>x>g.start&&x<g.end))candidates.push(x)}
  [min,max,...compressionZones.flatMap(g=>[g.start,g.end])].forEach(x=>candidates.push(x));
  const ticks=[...new Set(candidates)].sort((a,b)=>a-b).filter((x,i,arr)=>i===0||pct(x)-pct(arr[i-1])>=7||i===arr.length-1);
  const dateLabel=offset=>{const d=new Date(baseDateValue+'T00:00:00');d.setDate(d.getDate()+offset);return `${d.getMonth()+1}/${d.getDate()} `};
  const firstTickByDay=new Map();
  ticks.forEach(x=>{const day=Math.floor(x/1440);if(!firstTickByDay.has(day))firstTickByDay.set(day,x)});
  const hourLabel=x=>{const day=Math.floor(x/1440);const minuteOfDay=((x%1440)+1440)%1440;const showDate=firstTickByDay.get(day)===x;return `${showDate?dateLabel(day):''}${String(Math.floor(minuteOfDay/60)).padStart(2,'0')}:${String(minuteOfDay%60).padStart(2,'0')}`};
  const gapLabels=gaps.map(g=>`<span class="gap-label" style="left:${(pct(g.start)+pct(g.end))/2}%" title="空白${Math.round((g.end-g.start)/60*10)/10}時間を省略">⋯</span>`).join('');
  const workLabels=longWorkZones.map(g=>`<span class="gap-label" style="left:${(pct(g.start)+pct(g.end))/2}%" title="長時間作業の中間${Math.round((g.end-g.start)/60*10)/10}時間を圧縮">⋯</span>`).join('');
  const gapMarks=gaps.map(g=>`<span class="gap-mark" style="left:${(pct(g.start)+pct(g.end))/2}%" title="空白${Math.round((g.end-g.start)/60*10)/10}時間を省略"></span>`).join('');
  return `<div class="gantt"><div class="g-row g-head"><div class="g-label"><b>会社名／作業内容</b></div><div class="g-times">${ticks.map(x=>`<span style="left:${pct(x)}%">${hourLabel(x)}</span>`).join('')}${gapLabels}${workLabels}</div></div>${normalized.map(item=>{const {r,start,end,crossesMidnight}=item;let l=pct(start),w=pct(end)-pct(start);const endLabel=`${crossesMidnight?dateLabel(Math.floor(end/1440)):''}${esc(r.end)}`;const zones=longWorkZones.filter(g=>g.owner===item);const breakMark=zones.map(zone=>`<span class="work-break" style="left:${((pct(zone.start)+pct(zone.end))/2-l)/Math.max(w,.001)*100}%" title="他作業と重ならない区間を圧縮表示"></span>`).join('');return `<div class="g-row"><div class="g-label"><b>${esc(r.company)||'未入力'}</b>${esc(r.work)||'作業内容'}</div><div class="g-track">${gapMarks}<div class="g-bar" style="left:${l}%;width:${Math.max(0,w)}%">${esc(r.start)}–${endLabel}${breakMark}</div></div></div>`}).join('')}</div>`}
function renderGantt(id){const el=input(id);if(el)el.innerHTML=ganttHtml(schedules)}
function renderDocument(){const d=getData();input('document').innerHTML=`<article class="doc-page">${head(d)}${title(1,'工事内容書')}<div class="info"><div><b>案件名</b><span>${esc(d.project)||'—'}</span></div><div><b>工事日</b><span>${esc(d.date)||'—'}</span></div><div><b>拠点名</b><span>${esc(d.site)||'—'}</span></div><div><b>現場責任者</b><span>${esc(d.manager)||'—'}</span></div><div class="wide"><b>住所</b><span>${esc(d.address)||'—'}</span></div></div><h3 class="sub">工事概要</h3><div class="docbox">${esc(d.overview)||'—'}</div><h3 class="sub">使用機器・必要部材</h3><table><thead><tr><th>No.</th><th>メーカー</th><th>機種</th><th>シリアル</th><th>数量</th><th>必要部材・備考</th></tr></thead><tbody>${d.equipment.slice(0,12).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.maker)||'—'}</td><td>${esc(r.model)||'—'}</td><td>${esc(r.serial)||'���'}</td><td>${esc(r.quantity)}</td><td>${esc(r.parts)||'—'}</td></tr>`).join('')}</tbody></table>${foot(1)}</article><article class="doc-page">${head(d)}${title(2,'連絡体制')}<div class="flow">連絡フロー　現地作業者 → 現場責任者 → 工事統括 → 発注元責任者</div><h3 class="sub">関係者・関連会社</h3><table><thead><tr><th>会社名</th><th>部署</th><th>担当者</th><th>役割</th><th>電話番号</th><th>メール</th></tr></thead><tbody>${d.contacts.slice(0,14).map(r=>`<tr><td>${esc(r.company)||'—'}</td><td>${esc(r.department)||'—'}</td><td>${esc(r.person)||'—'}</td><td>${esc(r.role)||'—'}</td><td>${esc(r.phone)||'—'}</td><td>${esc(r.email)||'—'}</td></tr>`).join('')}</tbody></table><h3 class="sub">エスカレーション</h3><div class="docbox">${esc(d.escalation)||'—'}</div>${foot(2)}</article><article class="doc-page">${head(d)}${title(3,'工事スケジュール')}<div class="info"><div><b>工事日</b><span>${esc(d.date)||'—'}</span></div><div><b>拠点</b><span>${esc(d.site)||'—'}</span></div></div><h3 class="sub">タイムライン</h3>${ganttHtml(d.schedules.slice(0,12))}<h3 class="sub">作業一覧</h3><table><thead><tr><th>No.</th><th>会社名</th><th>作業内容</th><th>作業日</th><th>開始</th><th>終了</th></tr></thead><tbody>${d.schedules.slice(0,12).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.company)||'—'}</td><td>${esc(r.work)||'—'}</td><td>${esc(r.date||d.date)||'—'}</td><td>${esc(r.start)||'—'}</td><td>${esc(r.end)||'—'}</td></tr>`).join('')}</tbody></table><div class="note"><b>注意：</b>時刻変更や作業遅延が発生した場合は、連絡体制に従って速やかに関係者へ連絡してください。</div>${foot(3)}</article>`}
function collectForSave(){syncRows();return {project:input('project').value,site:input('site').value,address:input('address').value,date:input('date').value,manager:input('manager').value,overview:input('overview').value,escalation:input('escalation').value,equipment,contacts,schedules}}
function applySavedData(d){if(!d)return;['project','site','address','date','manager','overview','escalation'].forEach(k=>{if(d[k]!==undefined)input(k).value=d[k]});equipment=Array.isArray(d.equipment)?d.equipment:[];contacts=Array.isArray(d.contacts)?d.contacts:[];schedules=Array.isArray(d.schedules)?d.schedules:[];renderEditors();if(current===3)renderDocument()}
function setSaveStatus(text){const el=input('saveStatus');if(el)el.textContent=text}
function markUnsaved(){setSaveStatus('未保存')}
function safeFileName(name){return String(name||'工事仕様書').replace(/[\/:*?"<>|]/g,'_').trim()||'工事仕様書'}
async function exportWorkFile(){try{const payload={format:'construction-spec-builder',version:1,savedAt:new Date().toISOString(),data:collectForSave()};const json=JSON.stringify(payload,null,2);const suggested=safeFileName(input('project').value)+'_編集データ.json';if('showSaveFilePicker' in window){const handle=await window.showSaveFilePicker({suggestedName:suggested,types:[{description:'工事仕様書 編集データ',accept:{'application/json':['.json']}}]});const writable=await handle.createWritable();await writable.write(json);await writable.close();setSaveStatus('指定先へ保存済み')}else{alert('フォルダを指定して保存するには、Microsoft Edge または Google Chromeをご利用ください。');setSaveStatus('保存未対応')}}catch(e){if(e&&e.name==='AbortError'){setSaveStatus('保存キャンセル');return}setSaveStatus('保存失敗');alert('編集データを指定先へ保存できませんでした。')}}
function importWorkFile(event){const file=event.target.files&&event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const d=parsed&&parsed.format==='construction-spec-builder'?parsed.data:parsed;if(!d||typeof d!=='object'||!Array.isArray(d.equipment)||!Array.isArray(d.contacts)||!Array.isArray(d.schedules))throw new Error('invalid format');applySavedData(d);setSaveStatus('ファイル読込済み');alert('編集データを読み込みました。続きから編集できます。')}catch(e){setSaveStatus('読込失敗');alert('このファイルは読み込めません。工事仕様書ビルダーで保存したJSONファイルを選択してください。')}finally{event.target.value=''}};reader.onerror=()=>{setSaveStatus('読込失敗');alert('ファイルを読み込めませんでした。');event.target.value=''};reader.readAsText(file,'UTF-8')}
['project','site','address','date','manager','overview','escalation'].forEach(id=>input(id).addEventListener('input',()=>{markUnsaved();if(current===3)renderDocument()}));
document.addEventListener('input',e=>{if(e.target.closest('.rowbox'))markUnsaved()});
loadPresets();loadSample();showStep(0);
</script>
